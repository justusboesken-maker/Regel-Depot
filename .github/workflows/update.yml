name: Regel-Depot Update

on:
  schedule:
    # Alle Cron-Zeiten sind UTC. Die Läufe sollen das ganze Jahr zur selben Berliner Uhrzeit kommen (wie mit Justus festgelegt); deshalb gibt es
    # die meisten Zeiten doppelt, für Sommerzeit (Berlin = UTC+2) und Winterzeit (UTC+1). Der Schritt „Schritt bestimmen“ lässt den Lauf der
    # anderen Jahreszeit sofort aus. London stellt am selben Tag um wie Berlin, die Abstände zum Londoner Schluss bleiben also gleich.
    # GitHub startet geplante Läufe oft einige Minuten später.
    - cron: '17 13 * * 5'    # Fr 15:17 Berlin (Sommer): Vorwarnung FTSE All-World und Gold
    - cron: '17 14 * * 5'    #   … Winter
    - cron: '47 16 * * 5'    # Fr 18:47 Berlin (Sommer): Wochenschluss FTSE, Gold falls veröffentlicht, Euro-Kurse
    - cron: '47 17 * * 5'    #   … Winter
    - cron: '23 18 * * 5'    # Fr 20:23 Berlin (Sommer): Wiederholung, falls ein Schluss fehlte
    - cron: '23 19 * * 5'    #   … Winter
    - cron: '23 20 * * 5'    # Fr 22:23 Berlin (Sommer): Wiederholung
    - cron: '23 21 * * 5'    #   … Winter
    - cron: '37 23 * * 5'    # Sa 1:37 Berlin (Sommer): letzte Wiederholung, nach der üblichen LBMA-Veröffentlichung (22–23:30 UTC)
    - cron: '37 0 * * 6'     #   … Winter
    - cron: '23 7 * * 6'     # Sa 9:23 Berlin (Sommer): fehlende Schlüsse, Euro-Schlüsse vom Freitag
    - cron: '23 8 * * 6'     #   … Winter
    - cron: '17 19 * * 0'    # So 21:17 Berlin (Sommer): Vorwarnung Bitcoin
    - cron: '17 20 * * 0'    #   … Winter
    - cron: '7 0 * * 1'      # Mo 0:07 UTC (ganzjährig, die Bitcoin-Woche endet So 24 Uhr UTC): Wochenschluss Bitcoin, Push erst am Morgen
    - cron: '23 2 * * 1'     # Mo 2:23 UTC: Wiederholung, letzter Versuch der Nacht
    - cron: '53 5 * * 1'     # Mo 7:53 Berlin (Sommer): Benachrichtigungen vom Wochenende
    - cron: '53 6 * * 1'     #   … Winter
    - cron: '37 17 * * 1-4'  # Mo–Do 19:37 Berlin (Sommer): Euro-Kurse, FTSE-Tagesschluss
    - cron: '37 18 * * 1-4'  #   … Winter
    - cron: '37 21 * * 1-4'  # Mo–Do 23:37 Berlin (Sommer): Euro-Schlüsse des Tages (Lang & Schwarz schließt 23 Uhr)
    - cron: '37 22 * * 1-4'  #   … Winter
    - cron: '7 5-21 * * *'   # stündlich 05–21 UTC (ganzjährig): Kurs-Ticker (Bitcoin, Gold, EUR/USD, ETH, SOL, Lang & Schwarz)
    # Wochen, die vor dem Freitagabend enden (Feiertag am Freitag, Gründonnerstag, Gold vor Weihnachten/Neujahr): Vorwarnung und Wochenschluss
    # am letzten Handelstag zu den Freitagszeiten; an anderen Tagen endet der Lauf sofort ohne Commit.
    - cron: '17 13 * * 1-4'  # Mo–Do 15:17 Berlin (Sommer): Vorwarnung, falls die Woche heute endet
    - cron: '17 14 * * 1-4'  #   … Winter
    - cron: '47 16 * * 1-4'  # Mo–Do 18:47 Berlin (Sommer): vorgezogener Wochenschluss
    - cron: '47 17 * * 1-4'  #   … Winter
    # Halbtage (FTSE, London schließt 12:30 Uhr: letzter Geschäftstag vor Weihnachten und vor Neujahr, immer im Dezember = Winterzeit)
    - cron: '17 10 * 12 1-5' # Mo–Fr im Dezember 11:17 Berlin: Vorwarnung FTSE am Halbtag
    - cron: '47 13 * 12 1-5' # Mo–Fr im Dezember 14:47 Berlin: Wochenschluss FTSE am Halbtag
  workflow_dispatch:
    inputs:
      step:
        description: 'Schritt (auto erkennt ihn an der Uhrzeit)'
        type: choice
        default: auto
        options: [auto, live, fr-warn, fr-close, sa-close, so-warn, mo-close, mo-notify, eod, early-warn, early-close, early-warn-half, early-close-half, all, test-sources, test-eodhd, test-push]

permissions:
  contents: write

jobs:
  gate:
    # Kleiner Vorab-Job: bestimmt den Schritt und lässt Läufe der anderen Jahreszeit aus. Er gehört nicht zur Concurrency-Gruppe,
    # damit ein ausgelassener Lauf nie einen wartenden echten Lauf verdrängt.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.step.outputs.run }}
      step: ${{ steps.step.outputs.step }}
      final: ${{ steps.step.outputs.final }}
    steps:
      - name: Schritt bestimmen
        id: step
        shell: bash
        run: |
          FINAL=""; SEASON=any
          case "${{ github.event.schedule }}" in
            "17 13 * * 5") STEP=fr-warn; SEASON=summer ;;
            "17 14 * * 5") STEP=fr-warn; SEASON=winter ;;
            "47 16 * * 5") STEP=fr-close; SEASON=summer ;;
            "47 17 * * 5") STEP=fr-close; SEASON=winter ;;
            "23 18 * * 5") STEP=fr-close; FINAL="--fallback"; SEASON=summer ;;
            "23 19 * * 5") STEP=fr-close; FINAL="--fallback"; SEASON=winter ;;
            "23 20 * * 5") STEP=fr-close; FINAL="--fallback"; SEASON=summer ;;
            "23 21 * * 5") STEP=fr-close; FINAL="--fallback"; SEASON=winter ;;
            "37 23 * * 5") STEP=fr-close; FINAL="--fallback"; SEASON=summer ;;
            "37 0 * * 6")  STEP=fr-close; FINAL="--fallback"; SEASON=winter ;;
            "23 7 * * 6")  STEP=sa-close; FINAL="--fallback"; SEASON=summer ;;
            "23 8 * * 6")  STEP=sa-close; FINAL="--fallback"; SEASON=winter ;;
            "17 19 * * 0") STEP=so-warn; SEASON=summer ;;
            "17 20 * * 0") STEP=so-warn; SEASON=winter ;;
            "7 0 * * 1")   STEP=mo-close ;;
            "23 2 * * 1")  STEP=mo-close; FINAL="--final --fallback" ;;
            "53 5 * * 1")  STEP=mo-notify; SEASON=summer ;;
            "53 6 * * 1")  STEP=mo-notify; SEASON=winter ;;
            "37 17 * * 1-4") STEP=eod; SEASON=summer ;;
            "37 18 * * 1-4") STEP=eod; SEASON=winter ;;
            "37 21 * * 1-4") STEP=eod; SEASON=summer ;;
            "37 22 * * 1-4") STEP=eod; SEASON=winter ;;
            "7 5-21 * * *") STEP=live ;;
            "17 13 * * 1-4") STEP=early-warn; SEASON=summer ;;
            "17 14 * * 1-4") STEP=early-warn; SEASON=winter ;;
            "47 16 * * 1-4") STEP=early-close; SEASON=summer ;;
            "47 17 * * 1-4") STEP=early-close; SEASON=winter ;;
            "17 10 * 12 1-5") STEP=early-warn; FINAL="--half" ;;
            "47 13 * 12 1-5") STEP=early-close; FINAL="--half" ;;
            *) STEP="${{ inputs.step || 'auto' }}" ;;
          esac
          # Manuell: early-warn-half / early-close-half = Lauf für den Halbtag
          case "$STEP" in *-half) STEP="${STEP%-half}"; FINAL="--half" ;; esac
          # Berliner Sommerzeit = UTC+2 (+0200), Winterzeit = UTC+1 (+0100)
          if [ "$(TZ=Europe/Berlin date +%z)" = "+0200" ]; then NOW_SEASON=summer; else NOW_SEASON=winter; fi
          RUN=true
          if [ "$SEASON" != "any" ] && [ "$SEASON" != "$NOW_SEASON" ]; then RUN=false; fi
          echo "step=$STEP" >> "$GITHUB_OUTPUT"
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Schritt: $STEP $FINAL · Zeitplan $SEASON, jetzt $NOW_SEASON · ausführen: $RUN"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: regel-depot-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Kurse holen, Regeln rechnen, Benachrichtigungen, Änderungen speichern
        shell: bash
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUB_1: ${{ secrets.PUSH_SUB_1 }}
          PUSH_SUB_2: ${{ secrets.PUSH_SUB_2 }}
          PUSH_SUB_3: ${{ secrets.PUSH_SUB_3 }}
          PUSH_SUB_4: ${{ secrets.PUSH_SUB_4 }}
          PUSH_SUB_5: ${{ secrets.PUSH_SUB_5 }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
          PUSH_SENT_FILE: ${{ runner.temp }}/push-sent.json
          STEP: ${{ needs.gate.outputs.step }}
          FINAL: ${{ needs.gate.outputs.final }}
        run: |
          git config user.name "regel-depot-bot"
          git config user.email "regel-depot-bot@users.noreply.github.com"
          run_step() { node scripts/update.mjs --step "$STEP" $FINAL; }
          save() {
            git add docs/data
            if git diff --cached --quiet; then echo "Keine Änderungen."; return 0; fi
            SUMMARY=$(grep '^summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- | head -c 900 || true)
            git commit -q -m "Update $STEP $(date -u +'%Y-%m-%d %H:%M UTC')" -m "${SUMMARY:-–}"
            git push
          }
          run_step
          # Läuft parallel ein anderer Lauf (etwa der stündliche Ticker), lehnt GitHub den Push ab. Dann nicht blind zusammenführen
          # (das würde dessen Ergebnis überschreiben), sondern auf den neuen Stand aufsetzen und den Schritt wiederholen.
          # Push-Nachrichten, die der erste Anlauf schon zugestellt hat, merkt sich das Skript in PUSH_SENT_FILE und schickt sie nicht doppelt.
          for i in 1 2 3; do
            if save; then exit 0; fi
            echo "Push abgelehnt, ein anderer Lauf war schneller: neu aufsetzen und Schritt wiederholen ($i)"
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            sleep 5
            run_step
          done
          save
