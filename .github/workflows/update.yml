name: Regel-Depot Update

on:
  schedule:
    # Alle Zeiten UTC (Berlin = UTC+2 im Sommer, UTC+1 im Winter). GitHub startet geplante Läufe oft einige Minuten später.
    - cron: '17 13 * * 5'    # Freitag: Vorwarnung FTSE All-World und Gold
    - cron: '47 16 * * 5'    # Freitag: Wochenschluss FTSE (nach Londoner Schluss, Sommer wie Winter), Gold falls veröffentlicht, Euro-Kurse
    - cron: '23 18 * * 5'    # Freitag: Wiederholung, falls ein Schluss fehlte (Alpha Vantage / LBMA liefern oft erst abends)
    - cron: '23 20 * * 5'    # Freitag: Wiederholung
    - cron: '7 22 * * 5'     # Freitag: letzte Wiederholung
    - cron: '23 7 * * 6'     # Samstag: fehlende Schlüsse nachholen, Euro-Schlüsse vom Freitag (nicht zur gleichen Minute wie der Ticker)
    - cron: '17 19 * * 0'    # Sonntag: Vorwarnung Bitcoin
    - cron: '7 0 * * 1'      # Montag: Wochenschluss Bitcoin (Push erst am Morgen)
    - cron: '23 2 * * 1'     # Montag: Wiederholung, letzter Versuch der Nacht
    - cron: '53 5 * * 1'     # Montag: Benachrichtigungen vom Wochenende verschicken
    - cron: '37 17 * * 1-4'  # Mo–Do: Euro-Kurse für die Depotbewertung, FTSE-Tagesschluss
    - cron: '37 21 * * 1-4'  # Mo–Do: Euro-Schlüsse des Tages (Xetra-Schlüsse kommen abends)
    - cron: '7 5-21 * * *'   # täglich stündlich 05–21 UTC: Kurs-Ticker (Bitcoin, Gold, EUR/USD, ETH, SOL)
  workflow_dispatch:
    inputs:
      step:
        description: 'Schritt (auto erkennt ihn an der Uhrzeit)'
        type: choice
        default: auto
        options: [auto, live, fr-warn, fr-close, sa-close, so-warn, mo-close, mo-notify, eod, all, test-sources, test-eodhd, test-push]

permissions:
  contents: write

concurrency:
  group: regel-depot-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Schritt bestimmen
        id: step
        shell: bash
        run: |
          FINAL=""
          case "${{ github.event.schedule }}" in
            "17 13 * * 5") STEP=fr-warn ;;
            "47 16 * * 5") STEP=fr-close ;;
            "23 18 * * 5") STEP=fr-close; FINAL="--fallback" ;;
            "23 20 * * 5") STEP=fr-close; FINAL="--fallback" ;;
            "7 22 * * 5")  STEP=fr-close; FINAL="--fallback" ;;
            "23 7 * * 6")  STEP=sa-close; FINAL="--fallback" ;;
            "17 19 * * 0") STEP=so-warn ;;
            "7 0 * * 1")   STEP=mo-close ;;
            "23 2 * * 1")  STEP=mo-close; FINAL="--final --fallback" ;;
            "53 5 * * 1")  STEP=mo-notify ;;
            "37 17 * * 1-4") STEP=eod ;;
            "37 21 * * 1-4") STEP=eod ;;
            "7 5-21 * * *") STEP=live ;;
            *) STEP="${{ inputs.step || 'auto' }}" ;;
          esac
          echo "step=$STEP" >> "$GITHUB_OUTPUT"
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
          echo "Schritt: $STEP $FINAL"

      - name: Kurse holen, Regeln rechnen, Benachrichtigungen, Änderungen speichern
        shell: bash
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUB_1: ${{ secrets.PUSH_SUB_1 }}
          PUSH_SUB_2: ${{ secrets.PUSH_SUB_2 }}
          PUSH_SUB_3: ${{ secrets.PUSH_SUB_3 }}
          PUSH_SUB_4: ${{ secrets.PUSH_SUB_4 }}
          PUSH_SUB_5: ${{ secrets.PUSH_SUB_5 }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
          PUSH_SENT_FILE: ${{ runner.temp }}/push-sent.json
          STEP: ${{ steps.step.outputs.step }}
          FINAL: ${{ steps.step.outputs.final }}
        run: |
          git config user.name "regel-depot-bot"
          git config user.email "regel-depot-bot@users.noreply.github.com"
          run_step() { node scripts/update.mjs --step "$STEP" $FINAL; }
          save() {
            git add docs/data
            if git diff --cached --quiet; then echo "Keine Änderungen."; return 0; fi
            SUMMARY=$(grep '^summary=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- | head -c 900 || true)
            git commit -q -m "Update $STEP $(date -u +'%Y-%m-%d %H:%M UTC')" -m "${SUMMARY:-–}"
            git push
          }
          run_step
          # Läuft parallel ein anderer Lauf (etwa der stündliche Ticker), lehnt GitHub den Push ab. Dann nicht blind zusammenführen
          # (das würde dessen Ergebnis überschreiben), sondern auf den neuen Stand aufsetzen und den Schritt wiederholen.
          # Push-Nachrichten, die der erste Anlauf schon zugestellt hat, merkt sich das Skript in PUSH_SENT_FILE und schickt sie nicht doppelt.
          for i in 1 2 3; do
            if save; then exit 0; fi
            echo "Push abgelehnt, ein anderer Lauf war schneller: neu aufsetzen und Schritt wiederholen ($i)"
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            sleep 5
            run_step
          done
          save
